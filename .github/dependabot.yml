version: 2
# Do not set target-branch: when it is set, the options below (assignees,
# groups) stop applying to Dependabot security update PRs. Omitting it targets
# the default branch (main) and applies them to both.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - grimicorn
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - grimicorn
    groups:
      actions:
        update-types:
          - minor
          - patch
