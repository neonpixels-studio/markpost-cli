version: 2
# No target-branch override: updates go to the default branch (main), which also
# keeps Dependabot security update PRs enabled (those only run on the default
# branch when no target-branch is set).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - grimicorn
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - grimicorn
    groups:
      actions:
        update-types:
          - minor
          - patch
