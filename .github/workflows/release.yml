name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches package.json version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Pack and smoke-test the installed CLI artifact
        run: bash scripts/smoke-test-pack.sh
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing (OIDC): no stored npm token. Requires npm >= 11.5.1,
      # which ships with the Node version in .nvmrc.
      - run: npm publish --provenance --access public
