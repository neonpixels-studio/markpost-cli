name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.tag-check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches package.json version
        id: tag-check
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Pack and smoke-test the installed CLI artifact
        run: bash scripts/smoke-test-pack.sh
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config
      # The publish job ships this exact tarball, not a rebuild of the source.
      - name: Upload the smoke-tested tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # No dependency install and no build here: the job that holds the OIDC
      # publish token only handles the tarball the verify job smoke-tested.
      - name: Download the smoke-tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release-tarball
      # Trusted publishing (OIDC): no stored npm token. The trusted publisher
      # only allows `npm stage publish`, so this stages the release and a
      # maintainer approves it with 2FA (`npm stage approve <stage-id>`); a
      # leaked workflow token can't publish on its own. Needs the npm bundled
      # with the Node version in .nvmrc (11.19.1 has `npm stage`). The dist-tag
      # is always explicit (latest for X.Y.Z, the preid for prereleases) so a
      # prerelease never lands on latest and publishConfig.tag can't override it.
      - run: npm stage publish "$RUNNER_TEMP"/release-tarball/*.tgz --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
