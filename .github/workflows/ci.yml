name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Built CLI prints top-level help
        run: |
          node dist/index.js --help > "$RUNNER_TEMP/help.txt" 2>&1
          grep -q '^Usage: markpost <command>' "$RUNNER_TEMP/help.txt" || { echo "top-level usage line changed — update ci.yml or HELP_TEXT in src/index.ts"; cat "$RUNNER_TEMP/help.txt"; exit 1; }
        env:
          # conf -> env-paths reads XDG_CONFIG_HOME on Linux only; this keeps the
          # help smoke test off any real config store. Revisit if runs-on changes.
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config
