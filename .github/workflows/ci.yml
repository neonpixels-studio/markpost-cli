name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Pack and smoke-test the installed CLI artifact
        run: |
          # Installing the packed tarball (rather than running node
          # dist/index.js from the working tree) exercises the real
          # published `files`/`bin` config, catching the #152 class of
          # "declared bin doesn't exist in the tarball" bugs. Packing to a
          # known directory and globbing for the tarball (instead of
          # parsing `npm pack --json` output) sidesteps any risk of
          # lifecycle-script output landing on the same stream as the JSON.
          shopt -s nullglob
          pack_dir="$RUNNER_TEMP/pack"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir"
          tarballs=("$pack_dir"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball in $pack_dir, found ${#tarballs[@]}: ${tarballs[*]:-none}"
            exit 1
          fi
          npm install -g "${tarballs[0]}"
          markpost --help > "$RUNNER_TEMP/help.txt" 2>&1 || { status=$?; echo "installed CLI exited $status — see output below"; cat "$RUNNER_TEMP/help.txt"; exit 1; }
          grep -q '^Usage: markpost <command>' "$RUNNER_TEMP/help.txt" || { echo "top-level usage line changed — update ci.yml or HELP_TEXT in src/index.ts"; cat "$RUNNER_TEMP/help.txt"; exit 1; }
        env:
          # conf -> env-paths reads XDG_CONFIG_HOME on Linux only; this keeps the
          # help smoke test off any real config store. Revisit if runs-on changes.
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config
