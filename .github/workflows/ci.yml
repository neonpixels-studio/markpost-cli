name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Built CLI prints top-level help
        run: |
          node dist/index.js --help > help.txt
          grep -q '^Usage: markpost <command>' help.txt || { echo "top-level usage line changed — update ci.yml or src/index.ts:157"; cat help.txt; exit 1; }
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config
