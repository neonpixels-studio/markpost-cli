name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Pack and smoke-test the installed CLI artifact
        run: |
          # npm pack's own prepack/postpack hooks rebuild dist from a clean
          # state and verify dist/index.js exists, so a separate `npm run
          # build` step is redundant here. Installing the tarball (rather
          # than running node dist/index.js from the working tree) exercises
          # the actual published `files`/`bin` config, so this catches the
          # #152 class of "declared bin doesn't exist in the tarball" bugs.
          tarball=$(npm pack --json | jq -r '.[0].filename')
          npm install -g "./$tarball"
          markpost --help > "$RUNNER_TEMP/help.txt" 2>&1 || { status=$?; echo "installed CLI exited $status — see output below"; cat "$RUNNER_TEMP/help.txt"; exit 1; }
          grep -q '^Usage: markpost <command>' "$RUNNER_TEMP/help.txt" || { echo "top-level usage line changed — update ci.yml or HELP_TEXT in src/index.ts"; cat "$RUNNER_TEMP/help.txt"; exit 1; }
        env:
          # conf -> env-paths reads XDG_CONFIG_HOME on Linux only; this keeps the
          # help smoke test off any real config store. Revisit if runs-on changes.
          XDG_CONFIG_HOME: ${{ runner.temp }}/markpost-config
