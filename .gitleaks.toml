# Gitleaks configuration for @markpost/cli.
# Extends the gitleaks default ruleset and adds project-specific rules.
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[[rules]]
id = "clerk-secret-key"
description = "Clerk secret key (sk_live_ / sk_test_)"
# Only Clerk SECRET keys. Publishable keys (pk_live_/pk_test_) are public by
# design and must NOT be flagged.
regex = '''sk_(?:live|test)_[A-Za-z0-9]{20,}'''
keywords = ["sk_live_", "sk_test_"]

[[rules]]
id = "postgres-connection-uri"
description = "Postgres/Neon connection string with embedded credentials"
# Matches postgres:// and postgresql:// URIs that include a user:password
# component. The password group is required, so credential-free URIs are ignored.
regex = '''postgres(?:ql)?:\/\/[^\s:@\/]+:[^\s:@\/]+@[^\s\/]+'''
keywords = ["postgres://", "postgresql://"]

[allowlist]
description = "Global allowlist for example and fixture files"
# Accepted risk: secrets committed into example/fixture files are intentionally
# not flagged, since these hold placeholder credentials by design. Keep real
# secrets out of these paths.
#
# Deliberately scoped to actual test/spec files under tests?/ rather than a
# blanket `tests?/` prefix: the old blanket match also exempted
# verbatim-vendored contract files under tests/types/vendor/ and
# tests/libs/vendor/ (see markpost-cli#181), which must stay in scope for
# secret scanning since they're copied from another repo. RE2 (gitleaks'
# regex engine) has no negative lookahead, so "everything except vendor/"
# can't be expressed directly. Instead this explicitly enumerates the
# project's actual test subdirectories (types, libs, scripts, commands) —
# an allowlist of known-safe names, not a denylist of "vendor" — so a
# same-named vendor/ dir can never qualify no matter where it's nested.
# Adding a new tests/<subdir>/ requires adding it here too.
paths = [
  '''\.example$''',
  '''(^|/)(tests?|__tests__)/(?:(types|libs|scripts|commands)/)?[^/]+\.(test|spec)\.[cm]?[jt]sx?$''',
  '''(^|/)(fixtures?|__fixtures__)/''',
]
